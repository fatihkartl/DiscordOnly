name: Security and integrity checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source checksums and security policies
        run: python3 tests/test_security.py
      - name: Existing regression checks
        run: python3 tests/validate_source.py
  windows-parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts (not an antivirus verdict)
        shell: pwsh
        run: |
          Get-ChildItem app,tools -Filter '*.ps1' -Recurse | ForEach-Object {
            $t=$null; $e=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$t,[ref]$e)
            if ($e.Count -gt 0) { throw "PowerShell syntax error in $($_.FullName): $($e | Out-String)" }
          }
      - name: Validate checksums with PowerShell
        shell: powershell
        run: |
          $ok=& ./tools/Test-Integrity.ps1 -Root . -ManifestFile ./security/manifest.sha256 -Quiet
          if ($ok -ne $true) { throw 'Source checksum validation failed' }
