name: Build Windows Offline Portable ZIP
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse failed in $($_.FullName): $($errors | Out-String)" }
          }
      - name: Fetch and verify pinned upstream binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/Flowseal/zapret-discord-youtube/releases/download/1.10.4/zapret-discord-youtube-1.10.4.zip'
          $digest = '291af673bd0238506f9548e0e94ca0abf244000f4c9a06960544fb01c5f97b34'
          Invoke-WebRequest -Uri $url -OutFile upstream.zip
          $actual = (Get-FileHash upstream.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $digest) { throw "SHA256 mismatch: $actual" }
          New-Item -ItemType Directory -Force -Path extracted | Out-Null
          Expand-Archive upstream.zip -DestinationPath extracted
          $bin = Get-ChildItem extracted -Filter winws.exe -Recurse -File | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          if (!$bin) { throw 'winws.exe missing from upstream zip' }
          New-Item -ItemType Directory -Force -Path engine/bin | Out-Null
          Get-ChildItem $bin.DirectoryName -File | Where-Object { $_.Extension -in @('.exe','.dll','.sys','.bin') } | Copy-Item -Destination engine/bin
          $license = Get-ChildItem extracted -Filter LICENSE.txt -File -Recurse | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName engine/UPSTREAM_LICENSE.txt }
          if (!(Test-Path engine/bin/WinDivert64.sys)) { throw 'Missing WinDivert64.sys' }
          Remove-Item -Recurse -Force extracted,upstream.zip
      - name: Compile console-free Windows GUI launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if (!(Test-Path $compiler)) { throw 'Windows .NET Framework C# compiler missing' }
          & $compiler /nologo /target:winexe /out:DiscordOnly.exe /reference:System.Windows.Forms.dll launcher/DiscordOnlyLauncher.cs
          if ($LASTEXITCODE -ne 0) { throw 'Launcher compilation failed' }
      - name: Assemble offline distributable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output/DiscordOnly | Out-Null
          Copy-Item DiscordOnly.exe,Start.cmd,Start-Silent.vbs,Start-Debug.cmd,Repair-DNS.cmd,Repair-All.cmd,Diagnose-DNS.cmd,README.md,LICENSE,THIRD_PARTY_NOTICES.md -Destination output/DiscordOnly
          Copy-Item app -Destination output/DiscordOnly -Recurse
          Copy-Item tools -Destination output/DiscordOnly -Recurse
          Copy-Item engine -Destination output/DiscordOnly -Recurse
          Compress-Archive -Path output/DiscordOnly -DestinationPath DiscordOnly-Windows-Offline.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: DiscordOnly-Windows-Offline
          path: DiscordOnly-Windows-Offline.zip
          if-no-files-found: error
